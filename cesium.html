<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CesiumJS · SIG Castelldefels Digital Twin</title><script src="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Cesium.js"></script><link href="https://cesium.com/downloads/cesiumjs/releases/1.143/Build/Cesium/Widgets/widgets.css" rel="stylesheet"><style>html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#050b0e}.hud{position:absolute;z-index:2;top:16px;left:16px;padding:12px 14px;background:rgba(6,15,18,.86);color:#e9f5f2;font:13px system-ui;border:1px solid rgba(150,220,200,.18);border-radius:10px}.hud b{display:block;font-size:15px;margin-bottom:4px}</style></head><body><div id="cesiumContainer"></div><div class="hud"><b>SIG Castelldefels · CesiumJS</b>Laboratorio 3D abierto · sin Cesium Ion</div><script>
const viewer=new Cesium.Viewer('cesiumContainer',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:true,sceneModePicker:true,navigationHelpButton:true,terrainProvider:new Cesium.EllipsoidTerrainProvider(),imageryProvider:new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'})});
const url='https://raw.githubusercontent.com/truquinio/sig-castelldefels/master/data/castelldefels_boundary.geojson';
fetch(url).then(r=>r.json()).then(g=>Cesium.GeoJsonDataSource.load(g,{stroke:Cesium.Color.fromCssColorString('#76e3bd'),fill:Cesium.Color.fromCssColorString('#17352d').withAlpha(.12),strokeWidth:2})).then(ds=>viewer.dataSources.add(ds)).then(ds=>viewer.flyTo(ds));
</script></body></html>
